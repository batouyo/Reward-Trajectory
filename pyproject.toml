[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rewardflow-veloedit-calibration"
version = "0.1.0"
description = "Standalone VeloEdit-compatible activation-range calibration"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
